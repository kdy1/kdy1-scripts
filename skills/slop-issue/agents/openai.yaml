interface:
  display_name: "Slop Issue"
  short_description: "Generate AI slop for one issue and delegate PR upkeep"
  default_prompt: "Use $slop-issue to generate AI slop for one GitHub issue: if already resolved, post the evidence, close it as completed, and stop; otherwise implement and verify it, open a non-draft PR with a Closes reference, and delegate its maintenance to $maintain-pr at my chosen interval."

policy:
  allow_implicit_invocation: false
