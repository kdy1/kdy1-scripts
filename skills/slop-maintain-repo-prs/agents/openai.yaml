interface:
  display_name: "Slop Maintain Repo PRs"
  short_description: "Maintain repo or delegated batch PRs with Luna repairs"
  default_prompt: "Use $slop-maintain-repo-prs to maintain my open PRs targeting the repository's current default branch at my chosen interval (default: five minutes), recover incomplete repairs automatically in GPT-6 Luna worktree chats with xhigh reasoning effort, and archive successful repair chats."

policy:
  allow_implicit_invocation: false
