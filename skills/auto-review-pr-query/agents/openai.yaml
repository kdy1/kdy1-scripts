interface:
  display_name: "Auto Review PR Query"
  short_description: "Launch one T3 Code thread per PR that a GitHub search query matches, each running Auto Review PR Strict"
  default_prompt: "Use $auto-review-pr-query repo:<owner>/<repo> is:open -is:draft. 쿼리에 맞는 PR 중 아직 리뷰하지 않은 head를 골라 PR마다 T3 Code 스레드를 하나씩 만들고, 각 스레드에서 $auto-review-pr-strict를 적용한 뒤 settle해줘."

policy:
  allow_implicit_invocation: false
