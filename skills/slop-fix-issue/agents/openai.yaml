interface:
  display_name: "Slop Fix Issue"
  short_description: "Generate AI slop for one issue through PR creation"
  default_prompt: "Use $slop-fix-issue to generate AI slop for one GitHub issue: if already resolved, post the evidence, close it as completed, and stop; otherwise implement and verify it, open and attach a non-draft PR with a Closes reference, and stop."

policy:
  allow_implicit_invocation: false
