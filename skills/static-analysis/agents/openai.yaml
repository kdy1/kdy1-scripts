interface:
  display_name: "Static Analysis"
  short_description: "Analyze code with parallel subagents and record each confirmed bug"
  default_prompt: "Use $static-analysis. Statically analyze all code in <Scope> with parallel read-only analysis subagents, find every bug, and register each one with $add-issue. Do not batch issues; register each one as soon as it is confirmed. Continue until every unit in scope is covered, and treat each repeated invocation as a request for another pass. Settle the thread when a standalone run completes. The user specifies <Scope>; if it is omitted, analyze all code."
