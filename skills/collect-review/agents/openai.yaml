interface:
  display_name: "Collect Review"
  short_description: "Collect merged-PR findings, track issues and resolve threads"
  default_prompt: "Use $collect-review. <Scope>의 merged PR에 달린 Codex 자동 리뷰에서 resolve되지 않은 버그 후보를 수집하고 각각 $add-issue로 등록해. 후보를 모아두지 말고 발견하는 대로 전달해. 각 아이템의 이슈 등록 또는 기존 이슈 확인이 완료되면 해당 리뷰 스레드를 resolve해. 각 PR의 리뷰 처리가 끝나면 확인된 이슈와 원본 리뷰 링크를 Tracked at <이슈 URL> 형식으로 PR 댓글 하나에 모아줘. 재실행에서는 같은 댓글을 갱신하고, 확인된 이슈가 없으면 댓글을 남기지 마. <Scope>를 생략하면 대상 저장소의 merged PR 전체를 대상으로 해. 현재 PR head에서 해결된 지적은 등록하지 마."
