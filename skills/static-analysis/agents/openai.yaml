interface:
  display_name: "Static Analysis"
  short_description: "Analyze code and record each confirmed bug immediately"
  default_prompt: "Use $static-analysis. Statically analyze all code in <Scope>, find every bug, and register each one with $add-issue. Do not batch issues; register each one as soon as it is confirmed. The user specifies <Scope>; if it is omitted, analyze all code."
